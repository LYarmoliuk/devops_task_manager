name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # =========================
  # BACKEND
  # =========================
  backend:
    name: Backend - Build, Lint and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Build backend
        run: |
          python -m compileall app

      - name: Lint backend
        run: |
          ruff check app tests

      - name: Test backend
        env:
          PYTHONPATH: .
        run: |
          pytest


  # =========================
  # FRONTEND
  # =========================
  frontend:
    name: Frontend - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/nginx.conf
          test -f frontend/Dockerfile

      - name: Build frontend
        run: |
          docker build -t task-manager-frontend:test ./frontend

      - name: Test frontend
        run: |
          docker network create test-network

          docker run -d \
            --name frontend-test \
            --network test-network \
            --add-host backend:127.0.0.1 \
            -p 8080:80 \
            task-manager-frontend:test

          sleep 3

          docker ps -a
          docker logs frontend-test

          curl --fail http://localhost:8080

          docker rm -f frontend-test
          docker network rm test-network


  # =========================
  # DOCKER BUILD
  # =========================
  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: task-manager-backend:test

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: task-manager-frontend:test


  # =========================
  # PUBLISH TO GHCR
  # =========================
  publish:
    name: Docker - Publish Images
    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # Backend metadata
      # -------------------------
      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      # -------------------------
      # Frontend metadata
      # -------------------------
      - name: Extract frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}