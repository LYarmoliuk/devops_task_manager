name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend - Lint and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app tests

      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest


  frontend:
    name: Frontend - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/nginx.conf
          test -f frontend/Dockerfile

      - name: Build frontend Docker image
        run: docker build -t task-manager-frontend:test ./frontend

      - name: Test frontend container
        run: |
          docker network create test-network

          docker run -d \
            --name frontend-test \
            --network test-network \
            --add-host backend:127.0.0.1 \
            -p 8080:80 \
            task-manager-frontend:test

          sleep 3

          docker ps -a
          docker logs frontend-test

          curl --fail http://localhost:8080

          docker rm -f frontend-test
          docker network rm test-network

  docker:
    name: Docker - Build Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: task-manager-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: task-manager-frontend:ci