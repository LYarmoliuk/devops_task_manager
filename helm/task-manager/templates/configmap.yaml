apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "task-manager.fullname" . }}-config
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  DB_HOST: {{ printf "%s-postgres" (include "task-manager.fullname" .) | quote }}
  DB_PORT: {{ .Values.postgres.port | quote }}
