apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "task-manager.fullname" . }}-test-connection"
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - "wget -q -O /dev/null http://{{ include "task-manager.fullname" . }}-frontend:{{ .Values.frontend.port }}/"
